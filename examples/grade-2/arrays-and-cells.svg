<svg xmlns="http://www.w3.org/2000/svg" width="570" height="500" viewBox="0 0 570 500" role="img" aria-labelledby="title desc">
  <title id="title">Rows of counters and square tiles</title>
  <desc id="desc">A single row holds five dots. Three rows of four dots become four rows of three after a turn. A grid four cells wide and three high has twelve square interiors and twenty vertices. A final mat has five rows of five counters.</desc>
