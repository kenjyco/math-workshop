<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="494" viewBox="0 0 640 494" role="img" aria-labelledby="title desc">
  <title id="title">Lengths and materials of seven strips</title>
  <desc id="desc">The line plot from 3 through 8 centimeters has stack heights 1, 1, 0, 2, 2, 1. One strip-shaped icon represents one observation. The picture and bar graphs show three paper, two felt, one foil and one cork.</desc>
  <rect width="640" height="494" fill="white" />
  <text x="20" y="28" font-family="sans-serif" font-size="19" text-anchor="start" fill="#222222" font-weight="bold">Rounded strip lengths</text>
  <text x="22" y="53" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">Each cross represents one strip.</text>
  <line x1="110" y1="147" x2="510" y2="147" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  <line x1="110" y1="141" x2="110" y2="153" stroke="#222222" stroke-width="2" class="plot-tick" stroke-opacity="1" />
  <text x="110" y="174" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">3</text>
  <g class="cross">
    <line x1="104" y1="119" x2="116" y2="131" stroke="#222222" stroke-width="2" stroke-opacity="1" />
    <line x1="104" y1="131" x2="116" y2="119" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  </g>
  <line x1="190" y1="141" x2="190" y2="153" stroke="#222222" stroke-width="2" class="plot-tick" stroke-opacity="1" />
  <text x="190" y="174" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">4</text>
  <g class="cross">
    <line x1="184" y1="119" x2="196" y2="131" stroke="#222222" stroke-width="2" stroke-opacity="1" />
    <line x1="184" y1="131" x2="196" y2="119" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  </g>
  <line x1="270" y1="141" x2="270" y2="153" stroke="#222222" stroke-width="2" class="plot-tick" stroke-opacity="1" />
  <text x="270" y="174" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">5</text>
  <line x1="350" y1="141" x2="350" y2="153" stroke="#222222" stroke-width="2" class="plot-tick" stroke-opacity="1" />
  <text x="350" y="174" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">6</text>
  <g class="cross">
    <line x1="344" y1="119" x2="356" y2="131" stroke="#222222" stroke-width="2" stroke-opacity="1" />
    <line x1="344" y1="131" x2="356" y2="119" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  </g>
  <g class="cross">
    <line x1="344" y1="96" x2="356" y2="108" stroke="#222222" stroke-width="2" stroke-opacity="1" />
    <line x1="344" y1="108" x2="356" y2="96" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  </g>
  <line x1="430" y1="141" x2="430" y2="153" stroke="#222222" stroke-width="2" class="plot-tick" stroke-opacity="1" />
  <text x="430" y="174" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">7</text>
  <g class="cross">
    <line x1="424" y1="119" x2="436" y2="131" stroke="#222222" stroke-width="2" stroke-opacity="1" />
    <line x1="424" y1="131" x2="436" y2="119" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  </g>
  <g class="cross">
    <line x1="424" y1="96" x2="436" y2="108" stroke="#222222" stroke-width="2" stroke-opacity="1" />
    <line x1="424" y1="108" x2="436" y2="96" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  </g>
  <line x1="510" y1="141" x2="510" y2="153" stroke="#222222" stroke-width="2" class="plot-tick" stroke-opacity="1" />
  <text x="510" y="174" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">8</text>
  <g class="cross">
    <line x1="504" y1="119" x2="516" y2="131" stroke="#222222" stroke-width="2" stroke-opacity="1" />
    <line x1="504" y1="131" x2="516" y2="119" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  </g>
  <text x="552" y="174" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">cm</text>
  <line x1="20" y1="201" x2="620" y2="201" stroke="#222222" stroke-width="1" stroke-opacity="1" />
  <text x="20" y="232" font-family="sans-serif" font-size="19" text-anchor="start" fill="#222222" font-weight="bold">Strips by material</text>
  <text x="339" y="232" font-family="sans-serif" font-size="19" text-anchor="start" fill="#222222" font-weight="bold">Strips by material</text>
  <rect x="20" y="256" width="20" height="9" fill="#dadada" stroke="#222222" stroke-width="2" id="key" stroke-opacity="1" />
  <text x="50" y="266" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">= 1 strip</text>
  <text x="339" y="266" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">Number of strips</text>
  <text x="22" y="312" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">Paper</text>
  <rect x="99" y="301" width="20" height="9" fill="#dadada" stroke="#222222" stroke-width="2" class="picture" stroke-opacity="1" />
  <rect x="133" y="301" width="20" height="9" fill="#dadada" stroke="#222222" stroke-width="2" class="picture" stroke-opacity="1" />
  <rect x="167" y="301" width="20" height="9" fill="#dadada" stroke="#222222" stroke-width="2" class="picture" stroke-opacity="1" />
  <text x="22" y="357" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">Felt</text>
  <rect x="99" y="346" width="20" height="9" fill="#dadada" stroke="#222222" stroke-width="2" class="picture" stroke-opacity="1" />
  <rect x="133" y="346" width="20" height="9" fill="#dadada" stroke="#222222" stroke-width="2" class="picture" stroke-opacity="1" />
  <text x="22" y="402" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">Foil</text>
  <rect x="99" y="391" width="20" height="9" fill="#dadada" stroke="#222222" stroke-width="2" class="picture" stroke-opacity="1" />
  <text x="22" y="447" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="normal">Cork</text>
