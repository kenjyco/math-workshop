  <line x1="366" y1="425" x2="610" y2="425" stroke="#222222" stroke-width="2" stroke-opacity="1" />
  <text x="353" y="430" font-family="sans-serif" font-size="15" text-anchor="end" fill="#222222" font-weight="normal">0</text>
  <line x1="366" y1="386" x2="610" y2="386" stroke="#222222" stroke-width="1" stroke-opacity="1" />
  <text x="353" y="391" font-family="sans-serif" font-size="15" text-anchor="end" fill="#222222" font-weight="normal">1</text>
  <line x1="366" y1="347" x2="610" y2="347" stroke="#222222" stroke-width="1" stroke-opacity="1" />
  <text x="353" y="352" font-family="sans-serif" font-size="15" text-anchor="end" fill="#222222" font-weight="normal">2</text>
  <line x1="366" y1="308" x2="610" y2="308" stroke="#222222" stroke-width="1" stroke-opacity="1" />
  <text x="353" y="313" font-family="sans-serif" font-size="15" text-anchor="end" fill="#222222" font-weight="normal">3</text>
  <rect x="379" y="308" width="32" height="117" fill="#dadada" stroke="#222222" stroke-width="2" class="bar" stroke-opacity="1" />
  <text x="395" y="452" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">Paper</text>
  <rect x="439" y="347" width="32" height="78" fill="#dadada" stroke="#222222" stroke-width="2" class="bar" stroke-opacity="1" />
  <text x="455" y="452" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">Felt</text>
  <rect x="499" y="386" width="32" height="39" fill="#dadada" stroke="#222222" stroke-width="2" class="bar" stroke-opacity="1" />
  <text x="515" y="452" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">Foil</text>
  <rect x="559" y="386" width="32" height="39" fill="#dadada" stroke="#222222" stroke-width="2" class="bar" stroke-opacity="1" />
  <text x="575" y="452" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">Cork</text>
