<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="374" viewBox="0 0 600 374" role="img" aria-labelledby="title desc">
  <title id="title">Measuring seven sample strips</title>
  <desc id="desc">The left edge of each strip is zero. The right edges of A to G are 4.2, 5.8, 6.1, 3.2, 7.1, 6.8 and 7.9 centimeters from zero. Vertical guides show whole centimeters.</desc>
  <rect width="600" height="374" fill="white" />
  <text x="20" y="28" font-family="sans-serif" font-size="19" text-anchor="start" fill="#222222" font-weight="bold">Strip length in centimeters</text>
  <line x1="116" y1="66" x2="116" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="116" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">0</text>
  <line x1="166" y1="66" x2="166" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="166" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">1</text>
  <line x1="216" y1="66" x2="216" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="216" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">2</text>
  <line x1="266" y1="66" x2="266" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="266" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">3</text>
  <line x1="316" y1="66" x2="316" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="316" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">4</text>
  <line x1="366" y1="66" x2="366" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="366" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">5</text>
  <line x1="416" y1="66" x2="416" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="416" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">6</text>
  <line x1="466" y1="66" x2="466" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="466" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">7</text>
  <line x1="516" y1="66" x2="516" y2="344" stroke="#222222" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="1" />
  <text x="516" y="58" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal">8</text>
  <text x="65" y="97" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="normal">A</text>
  <rect x="116" y="83" width="210" height="16" fill="#dadada" stroke="#222222" stroke-width="2" id="strip-A" stroke-opacity="1" />
  <text x="65" y="135" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="normal">B</text>
  <rect x="116" y="121" width="290" height="16" fill="#dadada" stroke="#222222" stroke-width="2" id="strip-B" stroke-opacity="1" />
  <text x="65" y="173" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="normal">C</text>
  <rect x="116" y="159" width="305" height="16" fill="#dadada" stroke="#222222" stroke-width="2" id="strip-C" stroke-opacity="1" />
  <text x="65" y="211" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="normal">D</text>
  <rect x="116" y="197" width="160" height="16" fill="#dadada" stroke="#222222" stroke-width="2" id="strip-D" stroke-opacity="1" />
  <text x="65" y="249" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="normal">E</text>
