  <text x="79" y="138" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222" font-weight="normal">Triangle</text>
  <polygon points="191,40 266,40 286,103 187,103" fill="none" stroke="#222222" stroke-width="2" class="outline" stroke-opacity="1" />
