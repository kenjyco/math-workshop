  <text x="232" y="138" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222" font-weight="normal">Quadrilateral</text>
  <polygon points="387,27 442,57 424,107 357,107 341,57" fill="none" stroke="#222222" stroke-width="2" class="outline" stroke-opacity="1" />
