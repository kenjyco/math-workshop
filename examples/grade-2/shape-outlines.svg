<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc">
  <title id="title">Tracing sides and folding faces</title>
  <desc id="desc">Four outlines have three, four, five and six corners. A dot marks a starting corner on each. Two offset squares with joined corners show a cube. Its net has a belt of four squares with one above and one below the second.</desc>
