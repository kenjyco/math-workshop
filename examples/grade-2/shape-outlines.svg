  <text x="46" y="181" font-family="sans-serif" font-size="18" text-anchor="start" fill="#222222" font-weight="bold">Cube</text>
  <text x="335" y="181" font-family="sans-serif" font-size="18" text-anchor="start" fill="#222222" font-weight="bold">Unfolded faces</text>
