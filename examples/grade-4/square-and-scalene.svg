<svg xmlns="http://www.w3.org/2000/svg" width="570" height="236" viewBox="0 0 570 236" role="img" aria-labelledby="title desc">
  <title id="title">Four folds and no folds</title>
  <desc id="desc">Both figures use 30 drawing units per length unit. Four dashed axes pass through the square center. The triangle has legs of three and four and hypotenuse five.</desc>
  <rect width="570" height="236" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#19252c">
<rect x="70" y="47" width="120" height="120" fill="#edf2f3" stroke="#253641" stroke-opacity="1"/>
<line x1="130" y1="39" x2="130" y2="175" stroke="#253641" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="1"/>
<line x1="62" y1="107" x2="198" y2="107" stroke="#253641" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="1"/>
<line x1="64" y1="41" x2="196" y2="173" stroke="#253641" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="1"/>
<line x1="64" y1="173" x2="196" y2="41" stroke="#253641" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="1"/>
<text x="47" y="44" >A</text>
<text x="202" y="44" >B</text>
<text x="202" y="181" >C</text>
<text x="47" y="181" >D</text>
<text x="130" y="213" text-anchor="middle">Square</text>
<polygon points="326,166 446,166 446,76" fill="none" stroke="#253641" stroke-width="2" stroke-opacity="1"/>
<text x="386" y="191" text-anchor="middle">4</text>
<text x="460" y="127" >3</text>
<text x="377" y="109" >5</text>
<text x="386" y="216" text-anchor="middle">Scalene triangle</text>
  </g>
</svg>
