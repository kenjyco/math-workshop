<svg xmlns="http://www.w3.org/2000/svg" width="520" height="228" viewBox="0 0 520 228" role="img" aria-labelledby="title desc">
  <title id="title">Copies of fourths and fifths</title>
  <desc id="desc">Both scales run from zero to two meters. One meter spans 200 drawing units. The upper strip covers five fourths and the lower covers three groups of two fifths.</desc>
  <rect width="520" height="228" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#19252c">
<text x="42" y="25" >Five single fourths</text>
<rect x="48" y="42" width="50" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="98" y="42" width="50" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="148" y="42" width="50" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="198" y="42" width="50" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="248" y="42" width="50" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="298" y="42" width="50" height="26" fill="white" stroke="#253641" stroke-opacity="1"/>
