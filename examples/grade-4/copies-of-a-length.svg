<rect x="168" y="128" width="40" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="208" y="128" width="40" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="248" y="128" width="40" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
<rect x="288" y="128" width="40" height="26" fill="white" stroke="#253641" stroke-opacity="1"/>
<rect x="328" y="128" width="40" height="26" fill="white" stroke="#253641" stroke-opacity="1"/>
