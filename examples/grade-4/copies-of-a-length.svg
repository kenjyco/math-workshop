<rect x="398" y="42" width="50" height="26" fill="white" stroke="#253641" stroke-opacity="1"/>
<text x="42" y="112" >Three pairs of fifths</text>
<rect x="48" y="128" width="40" height="26" fill="#b1c8ce" stroke="#253641" stroke-opacity="1"/>
