<text x="88" y="191" text-anchor="middle">pair 1</text>
<line x1="129" y1="161" x2="129" y2="169" stroke="#253641" stroke-width="1.5" stroke-opacity="1"/>
<line x1="129" y1="169" x2="207" y2="169" stroke="#253641" stroke-width="1.5" stroke-opacity="1"/>
