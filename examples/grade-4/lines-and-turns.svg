<text x="496" y="55" >C</text>
<circle cx="344" cy="61" r="3" />
<text x="327" y="56" >D</text>
<line x1="344" y1="143" x2="356" y2="143" stroke="#253641" stroke-width="1.5" stroke-opacity="1"/>
<line x1="356" y1="143" x2="356" y2="155" stroke="#253641" stroke-width="1.5" stroke-opacity="1"/>
<line x1="26" y1="235" x2="215" y2="235" stroke="#253641" stroke-width="1.5" stroke-opacity="1"/>
<polygon points="215.00,235.00 205.00,231.00 205.00,239.00" fill="#253641"/>
