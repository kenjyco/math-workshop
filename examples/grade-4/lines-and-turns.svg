<polygon points="79.00,207.00 75.00,217.00 83.00,217.00" fill="#253641"/>
<text x="18" y="333" >Parallel lines and a perpendicular</text>
<circle cx="424" cy="260" r="57" fill="none" stroke="#77848a" stroke-opacity="1"/>
