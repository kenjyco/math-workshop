<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" role="img" aria-labelledby="title desc">
  <title id="title">Endpoints and directions</title>
  <desc id="desc">A point, segment, ray, line and crossing line pairs accompany a trapezoid with two parallel sides. A quarter-circle arc marks a right turn.</desc>
  <rect width="640" height="355" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#19252c">
<text x="20" y="35" >Point</text>
<circle cx="123" cy="30" r="3" />
<text x="20" y="75" >Segment</text>
<line x1="122" y1="69" x2="211" y2="69" stroke="#253641" stroke-width="1.5" stroke-opacity="1"/>
<circle cx="122" cy="69" r="3" />
<circle cx="211" cy="69" r="3" />
<text x="20" y="116" >Ray</text>
<line x1="122" y1="110" x2="220" y2="110" stroke="#253641" stroke-width="1.5" stroke-opacity="1"/>
<polygon points="220.00,110.00 210.00,106.00 210.00,114.00" fill="#253641"/>

<circle cx="122" cy="110" r="3" />
