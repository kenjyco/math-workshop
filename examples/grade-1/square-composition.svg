<svg xmlns="http://www.w3.org/2000/svg" width="546" height="134" viewBox="0 0 546 134" role="img" aria-labelledby="title desc">
  <title id="title">Two triangles make a square that joins another square</title>
  <desc id="desc">Left: two separate matching right triangles. Middle: their long edges coincide inside a square. Right: that square keeps its diagonal and joins a whole square along a vertical edge, forming a rectangle.</desc>
  <rect width="546" height="134" fill="white"/>
  <g font-family="sans-serif" font-size="18" fill="#18334a">
    <text x="22" y="27">Two pieces</text>
    <text x="200" y="27">Joined square</text>
    <text x="370" y="27">Square + square</text>
    <polygon points="22,60 70,60 70,108" id="piece-a" fill="#b2dacf" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    <polygon points="88,60 88,108 136,108" id="piece-b" fill="#d8b17a" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    <g id="joined" transform="translate(217 60)">
      <polygon points="0,0 48,0 48,48" fill="#b2dacf" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="0,0 0,48 48,48" fill="#d8b17a" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    </g>
    <g id="reused" transform="translate(376 60)">
      <polygon points="0,0 48,0 48,48" fill="#b2dacf" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="0,0 0,48 48,48" fill="#d8b17a" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    </g>
    <rect x="424" y="60" width="48" height="48" id="new-square" fill="#b1c9df" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
  </g>
</svg>
