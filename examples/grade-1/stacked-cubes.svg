<svg xmlns="http://www.w3.org/2000/svg" width="534" height="156" viewBox="0 0 534 156" role="img" aria-labelledby="title desc">
  <title id="title">Pairs of cubes make a box</title>
  <desc id="desc">Each loose cube joins a partner face to face. Two such pairs stack with all faces aligned. The final box is two cubes wide, two high and one deep. Lines across outside faces mark where cubes meet.</desc>
  <rect width="534" height="156" fill="white"/>
  <g font-family="sans-serif" font-size="18" fill="#18334a">
    <text x="20" y="24">Loose cubes</text>
    <text x="188" y="24">Joined pair</text>
    <text x="365" y="24">Two pairs stacked</text>
    <g id="cube-a" transform="translate(20 100)">
      <polygon points="0,0 34,0 34,34 0,34" fill="#b2dacf" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="0,0 16,-12 50,-12 34,0" fill="#e3eee4" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="34,0 50,-12 50,22 34,34" fill="#8fb8b3" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    </g>
    <g id="cube-b" transform="translate(82 100)">
      <polygon points="0,0 34,0 34,34 0,34" fill="#b2dacf" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="0,0 16,-12 50,-12 34,0" fill="#e3eee4" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="34,0 50,-12 50,22 34,34" fill="#8fb8b3" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    </g>
    <g id="pair" transform="translate(194 100)">
      <polygon points="0,0 68,0 68,34 0,34" fill="#b2dacf" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="0,0 16,-12 84,-12 68,0" fill="#e3eee4" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="68,0 84,-12 84,22 68,34" fill="#8fb8b3" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <line x1="34" y1="0" x2="34" y2="34" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <line x1="34" y1="0" x2="50" y2="-12" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    </g>
    <g id="stack" transform="translate(384 66)">
      <polygon points="0,0 68,0 68,68 0,68" fill="#b2dacf" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="0,0 16,-12 84,-12 68,0" fill="#e3eee4" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <polygon points="68,0 84,-12 84,56 68,68" fill="#8fb8b3" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <line x1="34" y1="0" x2="34" y2="68" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <line x1="34" y1="0" x2="50" y2="-12" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <line x1="0" y1="34" x2="68" y2="34" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
      <line x1="68" y1="34" x2="84" y2="22" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    </g>
  </g>
</svg>
