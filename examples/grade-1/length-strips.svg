<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380" role="img" aria-labelledby="title desc">
  <title id="title">Transfer marks and five-tile runs</title>
  <desc id="desc">A common start gives end marks in ribbon, cord, shelf order. Five 54-unit tiles reach the strip end when touching. A 12-unit gap overshoots and a 12-unit overlap falls short.</desc>
  <rect width="540" height="380" fill="white"/>
  <g font-family="sans-serif" font-size="18" fill="#18334a">
    <text x="18" y="28">Marks copied from one end of a paper strip</text>
    <text x="18" y="69">Ribbon</text>
    <line x1="150" y1="64" x2="294" y2="64" stroke="#3b7e84" stroke-opacity="1" stroke-width="5"/>
    <line x1="294" y1="56" x2="294" y2="72" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    <text x="18" y="103">Cord</text>
    <line x1="150" y1="98" x2="390" y2="98" stroke="#3b7e84" stroke-opacity="1" stroke-width="5"/>
    <line x1="390" y1="90" x2="390" y2="106" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    <text x="18" y="137">Shelf</text>
    <line x1="150" y1="132" x2="486" y2="132" stroke="#3b7e84" stroke-opacity="1" stroke-width="5"/>
    <line x1="486" y1="124" x2="486" y2="140" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    <line x1="150" y1="48" x2="150" y2="145" stroke="#18334a" stroke-opacity="1" stroke-width="2"/>
    <text x="18" y="176">A different strip, measured with five equal tiles</text>
    <text x="18" y="224">Touching</text>
    <g id="touching">
      <rect x="150" y="204" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="204" y="204" width="54" height="24" fill="#9bc3d3" fill-opacity=".7"/>
      <rect x="258" y="204" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="312" y="204" width="54" height="24" fill="#9bc3d3" fill-opacity=".7"/>
      <rect x="366" y="204" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="150" y="204" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="204" y="204" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="258" y="204" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="312" y="204" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="366" y="204" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
    </g>
    <text x="18" y="278">Gap</text>
    <g id="gap">
      <rect x="150" y="258" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="204" y="258" width="54" height="24" fill="#9bc3d3" fill-opacity=".7"/>
      <rect x="270" y="258" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="324" y="258" width="54" height="24" fill="#9bc3d3" fill-opacity=".7"/>
      <rect x="378" y="258" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="150" y="258" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="204" y="258" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="270" y="258" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="324" y="258" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="378" y="258" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
    </g>
    <text x="18" y="332">Overlap</text>
    <g id="overlap">
      <rect x="150" y="312" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="204" y="312" width="54" height="24" fill="#9bc3d3" fill-opacity=".7"/>
      <rect x="246" y="312" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="300" y="312" width="54" height="24" fill="#9bc3d3" fill-opacity=".7"/>
      <rect x="354" y="312" width="54" height="24" fill="#bee1d1" fill-opacity=".7"/>
      <rect x="150" y="312" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="204" y="312" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="246" y="312" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="300" y="312" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
      <rect x="354" y="312" width="54" height="24" stroke="#18334a" stroke-opacity="1" stroke-width="2" fill="none"/>
    </g>
    <line x1="150" y1="194" x2="150" y2="345" stroke="#33465b" stroke-dasharray="3 4"/>
    <line x1="420" y1="194" x2="420" y2="345" stroke="#33465b" stroke-dasharray="3 4"/>
    <text x="150" y="363" text-anchor="middle">Start</text>
    <text x="420" y="363" text-anchor="middle">Strip end</text>
  </g>
</svg>
