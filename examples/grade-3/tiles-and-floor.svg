<rect x="43" y="63" width="30" height="30" fill="#e2edf0" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<text x="80" y="85" font-size="16" text-anchor="start">1 cm</text>
<text x="58" y="116" font-size="15" text-anchor="middle">1 cm</text>
<text x="280" y="33" font-size="18" text-anchor="start">Three rows of four squares</text>
