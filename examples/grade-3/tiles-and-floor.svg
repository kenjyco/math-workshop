<svg xmlns="http://www.w3.org/2000/svg" width="610" height="370" viewBox="0 0 610 370" role="img" aria-labelledby="title desc">
<title id="title">A unit square, a rectangle and two cuts of one floor</title>
<desc id="desc">The paper has twelve centimeter squares. The floor has rows of four, six and six foot squares. Heavy seams show the two cuts.</desc>
