<line x1="132" y1="311" x2="132" y2="319" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="164" y1="311" x2="164" y2="319" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="196" y1="311" x2="196" y2="319" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="228" y1="311" x2="228" y2="325" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="260" y1="311" x2="260" y2="319" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="292" y1="311" x2="292" y2="319" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="324" y1="311" x2="324" y2="319" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="356" y1="311" x2="356" y2="325" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
