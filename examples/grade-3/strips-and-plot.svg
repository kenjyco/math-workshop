<g id="strip-D">
<rect x="100" y="215" width="160" height="12" fill="#536875" stroke="#263843" stroke-opacity="1" stroke-width="1"/>
</g>
<text x="70" y="248" font-size="15" text-anchor="start">E</text>
<g id="strip-E">
