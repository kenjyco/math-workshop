<line x1="158" y1="474" x2="170" y2="462" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="158" y1="438" x2="170" y2="450" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="158" y1="450" x2="170" y2="438" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
</g>
<line x1="249" y1="483" x2="249" y2="495" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
