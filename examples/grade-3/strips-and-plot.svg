<svg xmlns="http://www.w3.org/2000/svg" width="502" height="568" viewBox="0 0 502 568" role="img" aria-labelledby="title desc">
<title id="title">Measured strips and a quarter-inch line plot</title>
<desc id="desc">Read seven strips from zero on the two rulers. The five successive plot positions hold one, two, two, zero and two crosses.</desc>
<rect x="0" y="0" width="502" height="568" fill="#ffffff" stroke="none" stroke-opacity="0" stroke-width="1"/>
<g font-family="Arial, sans-serif" fill="#263843">
<text x="24" y="34" font-size="18" text-anchor="start">Half-inch ruler</text>
<text x="70" y="60" font-size="15" text-anchor="start">A</text>
<g id="strip-A">
<rect x="100" y="50" width="128" height="12" fill="#536875" stroke="#263843" stroke-opacity="1" stroke-width="1"/>
</g>
<text x="70" y="83" font-size="15" text-anchor="start">B</text>
<g id="strip-B">
<rect x="100" y="73" width="192" height="12" fill="#e2edf0" stroke="#263843" stroke-opacity="1" stroke-width="1"/>
</g>
<text x="70" y="106" font-size="15" text-anchor="start">C</text>
<g id="strip-C">
<rect x="100" y="96" width="256" height="12" fill="#536875" stroke="#263843" stroke-opacity="1" stroke-width="1"/>
</g>
<rect x="88" y="123" width="282" height="33" fill="#f1f4f5" stroke="#263843" stroke-opacity="1" stroke-width="1"/>
<g id="half-ticks">
<line x1="100" y1="123" x2="100" y2="137" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="164" y1="123" x2="164" y2="131" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="228" y1="123" x2="228" y2="137" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="292" y1="123" x2="292" y2="131" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<line x1="356" y1="123" x2="356" y2="137" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
</g>
<text x="100" y="152" font-size="13" text-anchor="middle">0</text>
<text x="228" y="152" font-size="13" text-anchor="middle">1</text>
<text x="356" y="152" font-size="13" text-anchor="middle">2</text>
<text x="381" y="146" font-size="15" text-anchor="start">inches</text>
<text x="24" y="199" font-size="18" text-anchor="start">Quarter-inch ruler</text>
