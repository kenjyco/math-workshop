<line x1="243" y1="462" x2="255" y2="474" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="243" y1="474" x2="255" y2="462" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="243" y1="438" x2="255" y2="450" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="243" y1="450" x2="255" y2="438" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
</g>
<line x1="334" y1="483" x2="334" y2="495" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<text x="334" y="519" font-size="16" text-anchor="middle">1 3/4</text>
<g id="stack-3">

</g>
<line x1="419" y1="483" x2="419" y2="495" stroke="#263843" stroke-opacity="1" stroke-width="2"/>
<text x="419" y="519" font-size="16" text-anchor="middle">2</text>
<g id="stack-4">
<line x1="413" y1="462" x2="425" y2="474" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="413" y1="474" x2="425" y2="462" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="413" y1="438" x2="425" y2="450" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
<line x1="413" y1="450" x2="425" y2="438" stroke="#263843" stroke-opacity="1" stroke-width="2.5"/>
</g>
<text x="249" y="550" font-size="16" text-anchor="middle">Length (inches)</text>
</g>
