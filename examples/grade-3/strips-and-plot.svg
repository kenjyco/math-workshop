<g id="strip-F">
<rect x="100" y="261" width="160" height="12" fill="#536875" stroke="#263843" stroke-opacity="1" stroke-width="1"/>
</g>
<text x="70" y="294" font-size="15" text-anchor="start">G</text>
<g id="strip-G">
<rect x="100" y="284" width="256" height="12" fill="#e2edf0" stroke="#263843" stroke-opacity="1" stroke-width="1"/>
</g>
