<svg xmlns="http://www.w3.org/2000/svg" width="535" height="378" viewBox="0 0 535 378" role="img" aria-labelledby="title desc">
<title id="title">One whole in equal parts</title>
<desc id="desc">A six-by-two sheet divides into three equal squares. Six intervals have seven boundaries. The lower line takes five quarter jumps on the same unit scale.</desc>
