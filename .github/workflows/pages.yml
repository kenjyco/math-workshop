name: Publish Homework Search

on: workflow_dispatch

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install Pandoc 3.2
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output pandoc.tar.gz https://github.com/jgm/pandoc/releases/download/3.2/pandoc-3.2-linux-amd64.tar.gz
          echo 'ea3f96dde56ae1577c81184694b8576d8efec52e168ce49a6e7df1441f428289  pandoc.tar.gz' | sha256sum --check
          tar -xzf pandoc.tar.gz pandoc-3.2/bin/pandoc
          echo "$RUNNER_TEMP/pandoc-3.2/bin" >> "$GITHUB_PATH"

      - name: Build and verify three fresh copies
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(python --version)" = 'Python 3.14.10'
          test "$(pandoc --version | sed -n '1p')" = 'pandoc 3.2'
          python search/build.py --out "$RUNNER_TEMP/site"
          python search/verify.py --site "$RUNNER_TEMP/site" --work "$RUNNER_TEMP/repeat"

      - name: Compare the upload with the accepted Search V2 manifest
        working-directory: ${{ runner.temp }}/site
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          rows = []
          for name in sorted(p.as_posix() for p in Path('.').rglob('*')):
              path = Path(name)
              if path.is_symlink():
                  raise SystemExit(f'Unexpected symbolic link: {name}')
              if path.is_dir() and any(path.iterdir()):
                  continue
              if not path.is_file() or path.stat().st_nlink != 1:
                  raise SystemExit(f'Unexpected artifact entry: {name}')
              rows.append(f'{sha256(path.read_bytes()).hexdigest()}  {name}\n')
          digest = sha256(''.join(rows).encode('utf-8')).hexdigest()
          print(f'{len(rows)} files, manifest SHA-256 {digest}')
          if len(rows) != 130 or digest != '7b0ce156ffdd92caaec5d16cc1f7c59a9ad3bf5df1279b29107c96b46701babb':
              raise SystemExit('Site differs from accepted Search V2')

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
